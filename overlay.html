<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <style>
        /* Styles from overlay.js HTML */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden;
            background-color: transparent; /* Ensure transparency */
            pointer-events: none;
        }
        #block-container {
            position: relative;
            width: 100%; height: 100%;
        }
        .text-block-overlay {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: sans-serif; font-weight: bold;
            padding: 1px 3px; margin: 0; box-sizing: border-box;
            overflow: hidden; display: flex; justify-content: center;
            align-items: center; text-align: center; line-height: 1.1;
            border-radius: 2px; pointer-events: none; user-select: none;
            white-space: pre-wrap; word-break: break-word;
            /* Font size will be set dynamically by JS */
        }
    </style>
</head>
<body>
    <div id="block-container"></div>
    <script src="overlayRenderer.js"></script>
</body>
</html>
